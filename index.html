<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <meta name="author" content="ClockFire">
    <meta name="keywords" content="ClockFire, YouTube, Information, Linktree">
    <meta name="description" content="유튜브 채널의 현황과 링크">
    <meta name="viewport" content="height=device-height, initial-scale=1.0">
    <title>Hyperspace</title>
    <style>
      *{
        color: white;
      }
      @font-face{
        font-family: 'HakgyoansimByeoljariTTF-B';
        src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimByeoljariTTF-B.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
      }
      body{
        margin: 0 auto;
        width: fit-content; /* 카드 크기에 맞게 조절됨 */
        background-color: black;
        font-family: 'HakgyoansimByeoljariTTF-B', sans-serif;
      }
      h3{
        margin: 4px;
        padding: 4px;
      }
      p{
        padding: 2px;
        margin: 2px;
      }

      #Name{
        font-size: 48px;
        margin: 20px 0;
        text-align: center;
      }
      #Channels{
        display: flex;
        padding: 10px;
        margin: 30px;
        border: 6px solid #999;
        border-radius: 30px;
        background: linear-gradient(210deg, #333 15%, #000, #220 45% 55%, #300, #020 85%);
      }

      .Card{
        width: 150px;
        height: 300px;
        margin: 10px;
        border: 6px solid #999;
        border-radius: 30px;
        background: #111;
        display: flex;
        flex-direction: column; /* 위에서 아래로 정렬 */
        align-items: center; /* 요소를 가로 중앙에 배치 */
        transition: transform 0.3s ease;
      }
      .Card:hover{
        transform: scale(1.05);
      }
      .Link{
        border-radius: 50%;
        margin: 12px;
      }
      .Cirbor{
        width: 120px;
        border-radius: 50%;
        border: 4px solid #999;
        transition: transform 0.3s ease;
      }
      .Cirbor:hover{
        border-color: #f93;
      }

      #Basket{
        background: #111;
        text-align: center;
        margin: 4px;
        border: 2px solid #999;
      }
    </style>
  </head>
  <body>
    <p id="Name"><strong>Hyperspace</strong></p>
    <div id="Channels"></div>
    <button id="Basket" onclick="Download()">download data</button>
    <script>
      const container = document.querySelector("#Channels");
      let ConsoleTableChannels

      console.time("Puffball");
      fetch("/.netlify/functions/api")
        .then(response => response.json())
        .then(data => {
          ConsoleTableChannels = data;
          console.timeLog("Puffball");
          
          for(const channel of ConsoleTableChannels.CleanChannelList){
          //채널 카드 생성
          const card = document.createElement("div");
          card.innerHTML = `
            <a href="https://youtube.com/channel/${channel.ID}/videos" target="_blank" class="Link">
              <img src="${channel.PFP}" alt="${channel.Name}의 프로필 사진"  class="Cirbor">
            </a>
            <h3>${channel.Name}</h3>
            <p>구독자 ${channel.SubscriberCount}명</p>
            <p>조회수 ${channel.ViewCount}회</p>
            <p>동영상 ${channel.VideoCount}개</p>
          `;
          container.appendChild(card);
          card.classList.add('Card');
        };

        console.log(ConsoleTableChannels.Information)
        console.table(ConsoleTableChannels.CleanChannelList, ["Name", "SubscriberCount", "ViewCount", "VideoCount"]);
        console.timeEnd("Puffball");
      });

      function Download(){
        const DownloadData = JSON.stringify(ConsoleTableChannels, null, 2);
        const DownloadBlob = new Blob([DownloadData], { type: "application/json" });
        const DownloadLink = URL.createObjectURL(DownloadBlob);

        const DownloadButton = document.createElement("a");
        DownloadButton.href = DownloadLink;
        DownloadButton.download = `Hyperspace_${ConsoleTableChannels.Information.Time}.json`;
        document.body.appendChild(DownloadButton);
        DownloadButton.click();
        document.body.removeChild(DownloadButton);
        URL.revokeObjectURL(DownloadLink);
      }
      /*
      git add . 전부 추가
      git status 추가 확인
      git commit -m "Puffball" 버전 이름
      git push origin master 최종 전송
      */
    </script>
  </body>
</html>
